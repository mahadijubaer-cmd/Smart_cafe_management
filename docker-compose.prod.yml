services:
  postgres:
    image: postgres:15-alpine
    container_name: scms_postgres_prod
    environment:
      - POSTGRES_DB=scms
      - POSTGRES_USER=scms
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scms_prod_secret}
    # No host port mapping: the backend reaches Postgres over the compose network. Never publish
    # 5432 on a public VM (specs/operations/deployment.md "Production compose contract").
    volumes:
      - scms_postgres_data:/var/lib/postgresql/data
    networks:
      - scms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scms -d scms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scms_redis_prod
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - scms_redis_data:/data
    networks:
      - scms_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scms_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@scms.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-pgadmin_secret}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    # Loopback only — on a VM, reach it via SSH tunnel: ssh -L 5050:localhost:5050 user@host
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - scms_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scms_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scms_backend_prod
    env_file: .env
    # No host port mapping: Caddy is the only public entrypoint (reaches this over
    # scms_network on :8000). Never publish 8000 directly on a public VM.
    volumes:
      - scms_media:/app/media
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://scms:${POSTGRES_PASSWORD:-scms_prod_secret}@postgres:5432/scms
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DEBUG=false
      - ENVIRONMENT=production
    networks:
      - scms_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the client bundle at build time — they MUST be build args,
      # not runtime environment (specs/operations/deployment.md "Production compose contract").
      # NEXT_PUBLIC_WS_URL carries NO /ws suffix: useWebSocket.ts appends /ws/{user_id} itself.
      # No :8000 port: Caddy terminates TLS on 443 and reverse-proxies /api and /ws to the
      # backend, so the public-facing origin is just the bare domain over https/wss.
      args:
        - NEXT_PUBLIC_API_URL=https://${SERVER_HOST:-localhost}/api/v1
        - NEXT_PUBLIC_WS_URL=wss://${SERVER_HOST:-localhost}
    container_name: scms_frontend_prod
    # No host port mapping: Caddy proxies to this over scms_network on :3000.
    depends_on:
      - backend
    environment:
      - API_INTERNAL_URL=http://backend:8000/api/v1
      - NODE_ENV=production
    networks:
      - scms_network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: scms_caddy_prod
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - scms_caddy_data:/data
      - scms_caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - scms_network
    restart: unless-stopped

volumes:
  scms_postgres_data:
  scms_redis_data:
  scms_media:
  scms_pgadmin_data:
  scms_caddy_data:
  scms_caddy_config:

networks:
  scms_network:
    driver: bridge
