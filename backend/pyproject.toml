[tool.poetry]
name = "smart-cafe-management-system-backend"
version = "0.1.0"
description = "Backend API for Smart Cafe Management System"
authors = ["Copilot <copilot@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.104.1"
uvicorn = { version = "0.24.0", extras = ["standard"] }
sqlalchemy = "2.0.23"
asyncpg = "0.29.0"
alembic = "1.13.0"
pydantic = "2.5.0"
pydantic-settings = "2.1.0"
email-validator = "2.2.0"
python-jose = { version = "3.3.0", extras = ["cryptography"] }
passlib = { version = "1.7.4", extras = ["bcrypt"] }
python-multipart = "0.0.6"
python-dotenv = "1.0.0"
httpx = "0.25.2"
websockets = "12.0"
aiofiles = "23.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"