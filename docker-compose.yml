services:
  postgres:
    image: postgres:15-alpine
    container_name: scms_postgres
    environment:
      - POSTGRES_DB=scms
      - POSTGRES_USER=scms
      - POSTGRES_PASSWORD=scms
    ports:
      - "5433:5432"
    volumes:
      - scms_postgres_data:/var/lib/postgresql/data
    networks:
      - scms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scms -d scms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scms_redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - scms_redis_data:/data
    networks:
      - scms_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    container_name: scms_backend
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - scms_media:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://scms:scms@postgres:5432/scms
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    networks:
      - scms_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: scms_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1
      - API_INTERNAL_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
      # Windows bind mounts don't emit inotify events — poll for file changes so
      # Next.js Fast Refresh works when editing on the host.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - scms_network

volumes:
  scms_postgres_data:
  scms_redis_data:
  scms_media:

networks:
  scms_network:
    driver: bridge
